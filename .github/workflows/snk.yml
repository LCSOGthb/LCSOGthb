name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  workflow_dispatch: # Allows manual trigger

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    permissions:
      contents: write # Essential for pushing files back to the repo

    steps:
      # 1. Necessary to let the runner access your repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Generates the snake files (Your original code)
      - name: Generate snake files
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9&color_background=#aaaaaa

      # 3. Pushes the 'dist' folder to a separate branch called 'output'
      # This makes the files permanent and accessible via URL
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
